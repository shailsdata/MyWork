<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Python Calculator</h2>
    <form method="POST" action="/">
        <div class="form-group">
            <label for="num1">First Number:</label>
            <input type="number" step="any" id="num1" name="num1" required>
        </div>
        <div class="form-group">
            <label for="num2">Second Number:</label>
            <input type="number" step="any" id="num2" name="num2" required>
        </div>
        <div class="form-group">
            <label for="operation">Operation:</label>
            <select id="operation" name="operation">
                <!-- Loop through the options from the Python script to create the dropdown -->
                {% for name, value in options %}
                    <option value="{{ value }}">{{ name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">Calculate</button>
    </form>

    <!-- Display the result or an error message if it exists -->
    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}
    {% if error %}
        <div class="result error">{{ error }}</div>
    {% endif %}
</body>
</html>
